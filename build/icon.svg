<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f3a"/>
      <stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8703f"/>
      <stop offset="0.55" stop-color="#8a5a33"/>
      <stop offset="1" stop-color="#6b4426"/>
    </linearGradient>
    <radialGradient id="tea" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#d79a5c"/>
      <stop offset="1" stop-color="#b0743d"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- steam -->
  <path d="M214 196 C 196 172, 232 150, 214 122" fill="none" stroke="#e6e8ec" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <path d="M290 196 C 272 172, 308 150, 290 122" fill="none" stroke="#e6e8ec" stroke-width="16" stroke-linecap="round" opacity="0.4"/>

  <!-- foot -->
  <ellipse cx="256" cy="402" rx="64" ry="16" fill="#5a381f"/>
  <!-- bowl body -->
  <path d="M112 236 C 118 338, 176 398, 256 400 C 336 398, 394 338, 400 236 Z" fill="url(#bowl)"/>
  <!-- rim and tea surface -->
  <ellipse cx="256" cy="236" rx="144" ry="36" fill="#c28a55"/>
  <ellipse cx="256" cy="238" rx="128" ry="27" fill="url(#tea)"/>

  <!-- leaf -->
  <path d="M206 330 C 214 284, 268 266, 316 280 C 304 324, 256 348, 206 330 Z" fill="#1bd96a"/>
  <path d="M214 326 C 246 312, 278 296, 308 284" fill="none" stroke="#0f9447" stroke-width="6" stroke-linecap="round"/>
</svg>
